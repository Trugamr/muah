# muah — tmux color theme
# Generated from palette/dark.json — do not edit by hand.

# Status bar
set -g status-style                  "bg={{surface0}},fg={{text}}"

# Window status (the "tabs" in the status bar)
set -g window-status-style           "bg={{surface0}},fg={{subtext}}"
set -g window-status-current-style   "bg={{surface0}},fg={{pink}},bold"
set -g window-status-activity-style  "bg={{surface0}},fg={{yellow}}"
set -g window-status-bell-style      "bg={{surface0}},fg={{crimson}}"

# Pane borders
set -g pane-border-style             "fg={{overlay0}}"
set -g pane-active-border-style      "fg={{pink}}"

# Message bar
set -g message-style                 "bg={{surface1}},fg={{text}}"
set -g message-command-style         "bg={{surface1}},fg={{pink}}"

# Copy-mode selection
set -g mode-style                    "bg={{focus_blue}},fg={{text}}"

# Display / clock
set -g display-panes-active-colour   "{{pink}}"
set -g display-panes-colour          "{{overlay1}}"
set -g clock-mode-colour             "{{pink}}"
