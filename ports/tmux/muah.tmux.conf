# muah — tmux color theme
# Generated from palette/dark.json — do not edit by hand.

# Status bar
set -g status-style                  "bg=#151b23,fg=#f0f6fc"

# Window status (the "tabs" in the status bar)
set -g window-status-style           "bg=#151b23,fg=#9198a1"
set -g window-status-current-style   "bg=#151b23,fg=#ef8fb4,bold"
set -g window-status-activity-style  "bg=#151b23,fg=#f8dfa5"
set -g window-status-bell-style      "bg=#151b23,fg=#e06868"

# Pane borders
set -g pane-border-style             "fg=#3d444d"
set -g pane-active-border-style      "fg=#ef8fb4"

# Message bar
set -g message-style                 "bg=#212830,fg=#f0f6fc"
set -g message-command-style         "bg=#212830,fg=#ef8fb4"

# Copy-mode selection
set -g mode-style                    "bg=#5e95da,fg=#f0f6fc"

# Display / clock
set -g display-panes-active-colour   "#ef8fb4"
set -g display-panes-colour          "#656c76"
set -g clock-mode-colour             "#ef8fb4"
